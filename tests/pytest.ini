[pytest]
asyncio_mode = auto
testpaths = unit api
addopts = -ra --strict-markers
markers =
    unit: pure-Python tests of ui/* modules (no network, no subprocess)
    api: FastAPI HTTP endpoint tests via httpx ASGITransport
    docker_image: smoke test of the built docker image (requires docker; gate CHAIN_PROXY_TEST_DOCKER=1)
filterwarnings =
    ignore::DeprecationWarning
