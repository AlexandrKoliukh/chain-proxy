---
# ╔════════════════════════════════════════════════════════════════╗
# ║ VPS2 (foreign server, exit).                                   ║
# ║ Now a thin WireGuard NAT gateway — Xray is no longer deployed  ║
# ║ here. Receives traffic from VPS1 over wg0 and MASQUERADEs it.  ║
# ║ Values are read from environment variables (see .env).         ║
# ╚════════════════════════════════════════════════════════════════╝

wg_private_key:     "{{ lookup('env', 'WG_VPS2_PRIVATE') }}"
wg_peer_public_key: "{{ lookup('env', 'WG_VPS1_PUBLIC') }}"

# 443 больше не нужен — клиенты подключаются только к VPS1.
firewall_allowed_tcp_ports:
  - 22
firewall_allowed_udp_ports:
  - "{{ wg_listen_port }}"
