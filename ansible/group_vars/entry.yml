---
# ╔════════════════════════════════════════════════════════════════╗
# ║ VPS1 (home server, entry).                                     ║
# ║ Values are read from environment variables (see .env).         ║
# ║ Populate them with `make gen-keys` — no manual editing needed. ║
# ╚════════════════════════════════════════════════════════════════╝

# ─── Client → VPS1 (entry inbound) ────────────────────────────────
entry_listen_port: 443
entry_private_key: "{{ lookup('env', 'ENTRY_PRIVATE_KEY') }}"
entry_public_key:  "{{ lookup('env', 'ENTRY_PUBLIC_KEY') }}"
entry_short_id:    "{{ lookup('env', 'ENTRY_SHORT_ID') }}"

# Список клиентов входного inbound. Каждый клиент = отдельный VLESS-UUID,
# но все они делят один Reality-серверный ключ и shortId. Чтобы добавить
# ещё одного — заведите новую env-переменную (например, ENTRY_GUEST_UUID),
# экспортируйте её в Makefile, сгенерируйте UUID и допишите запись сюда.
entry_clients:
  - email: "admin"
    id: "{{ lookup('env', 'ENTRY_CLIENT_UUID') }}"
  - email: "friends"
    id: "{{ lookup('env', 'ENTRY_FRIENDS_UUID') }}"

# ─── VPS1 → VPS2 (chain-link outbound) ────────────────────────────
# `link_public_key` must be the public half of `exit_private_key` on VPS2.
link_uuid:         "{{ lookup('env', 'LINK_UUID') }}"
link_public_key:   "{{ lookup('env', 'LINK_PUBLIC_KEY') }}"
link_short_id:     "{{ lookup('env', 'LINK_SHORT_ID') }}"

# Address of VPS2 — auto-resolved from inventory. Override if you want to
# use a domain name or a private link IP for the inter-VPS hop.
exit_address: "{{ hostvars[groups['exit'][0]].ansible_host }}"
exit_port: 443
