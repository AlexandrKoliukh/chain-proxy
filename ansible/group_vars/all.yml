---
# ─── Xray runtime layout ──────────────────────────────────────────
xray_install_version: latest          # tag or 'latest' — passed to XTLS install-release.sh
xray_config_dir: /usr/local/etc/xray
xray_assets_dir: /usr/local/share/xray
xray_log_dir: /var/log/xray
xray_service_name: xray
# Override to 'info' or 'debug' temporarily for routing diagnostics:
#   ansible-playbook ... -e xray_loglevel=info
xray_loglevel: warning

# ─── Geodata auto-update ──────────────────────────────────────────
geodata_update_enabled: true
geodata_update_cron:
  minute: "0"
  hour: "4"
  weekday: "0"        # Sunday

# ─── Reality SNI target ───────────────────────────────────────────
# Must be a TLS-1.3 host reachable from the VPS, non-CDN, and not on
# a blocklist. www.microsoft.com is the common default; change if needed.
reality_dest_host: "www.microsoft.com"
reality_dest_port: 443
reality_fingerprint: "chrome"

# ─── Firewall ────────────────────────────────────────────────────
firewall_enabled: true
firewall_allowed_tcp_ports:
  - 22
  - 443
# Per-host overrides (e.g. exit drops 443) live in group_vars/{entry,exit}.yml.

# ─── Inter-VPS WireGuard tunnel (replaces inner Reality hop) ─────
# VPS1 (entry) ──UDP/wg_listen_port──▶ VPS2 (exit). Xray on VPS1 marks
# its chain-proxy outbound sockets with `wg_fwmark`; the kernel routes
# those packets via wg0 using `wg_route_table`. VPS2 NATs them out.
wg_subnet: "10.66.0.0/30"
wg_entry_addr: "10.66.0.1"
wg_exit_addr:  "10.66.0.2"
wg_listen_port: 51820
wg_mtu: 1420
wg_fwmark: 255          # 0xff — must match streamSettings.sockopt.mark in Xray
wg_route_table: 100
