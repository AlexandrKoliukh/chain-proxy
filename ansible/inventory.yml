---
# ┌─────────────────────────────────────────────────────────────────┐
# │ Fill in the public IPs (or hostnames) into .env                 │
# │ Both must already have Ubuntu 24.04 and root SSH access.        │
# └─────────────────────────────────────────────────────────────────┘
all:
  children:
    entry:
      hosts:
        vps1:
          ansible_host: "{{ lookup('env', 'IP_VPS1') }}"
    exit:
      hosts:
        vps2:
          ansible_host: "{{ lookup('env', 'IP_VPS2') }}"
  vars:
    ansible_user: root
    ansible_port: 22
    ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new'
