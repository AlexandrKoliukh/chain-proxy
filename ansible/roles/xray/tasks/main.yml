---
# Install Xray using the upstream XTLS install-release.sh.
# The script handles: binary download from GitHub releases, systemd unit,
# nobody user, /usr/local/etc/xray layout, geoip.dat / geosite.dat.
# Docs: https://github.com/XTLS/Xray-install

- name: Ensure Xray config directory exists
  file:
    path: "{{ xray_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Match what XTLS install-release.sh enforces on every run (see install_xray()
# in https://github.com/XTLS/Xray-install — `chown 0:0` + `chmod 755` are
# inside the `else` branch that runs whenever /var/log/xray/ already exists).
# Setting nobody:nogroup 0775 here would flip-flop on every play: our task
# changes it, install-release.sh resets it back, idempotence test fails.
# chain-proxy does not write log files anyway — Xray logs go to stdout/stderr
# → journald (see CLAUDE.md). The directory is here only because XTLS creates
# it; we just need the perms to match so we stop fighting the installer.
- name: Ensure Xray log directory exists (matches XTLS install-release.sh)
  file:
    path: "{{ xray_log_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Stat existing Xray binary
  stat:
    path: /usr/local/bin/xray
  register: xray_binary

- name: Install / update Xray-core from GitHub releases
  shell: |
    set -o pipefail
    curl -fsSL https://github.com/XTLS/Xray-install/raw/main/install-release.sh \
      | bash -s -- install{% if xray_install_version != 'latest' %} --version {{ xray_install_version }}{% endif %}
  args:
    executable: /bin/bash
  register: xray_install
  changed_when: "'installed' in (xray_install.stdout | lower) or not xray_binary.stat.exists"
  notify: restart xray

- name: Show installed Xray version
  command: /usr/local/bin/xray version
  register: xray_version_out
  changed_when: false

# `install-geodata` always re-downloads geoip.dat AND geosite.dat from XTLS,
# overwriting whatever is on disk. Without `creates:` it would re-download on
# every play, clobber our roscomvpn geoip.dat, and trigger the entire roscomvpn
# block + xray restart handler again — breaking idempotence. (The XTLS script
# also doesn't print the "installation of geodata is complete" string we look
# for below, so changed_when never matches and the task masquerades as `ok`
# while still mutating files.) Weekly cron `xray-update-geodata.sh` is the
# proper path for refreshing geosite.dat.
- name: Install / update geodata (geoip.dat + geosite.dat)
  shell: |
    curl -fsSL https://github.com/XTLS/Xray-install/raw/main/install-release.sh \
      | bash -s -- install-geodata
  args:
    executable: /bin/bash
    creates: "{{ xray_assets_dir }}/geosite.dat"
  register: geodata_install
  changed_when: "'installation of geodata is complete' in (geodata_install.stdout | lower)"

- name: Overwrite geoip.dat with hydraponique/roscomvpn-geoip release
  when: roscomvpn_geoip_enabled
  block:
    # Keep the sidecar at a stable path — it serves as the "expected sha256" marker.
    # force: false means we skip the download when it already exists, making the
    # whole block idempotent. The weekly cron script fetches a fresh copy into a
    # tmpdir independently, so the stale sidecar on disk doesn't affect updates.
    - name: Download roscomvpn geoip.dat sha256 sidecar
      get_url:
        url: "{{ roscomvpn_geoip_sha256_url }}"
        dest: "{{ xray_assets_dir }}/geoip.dat.sha256"
        mode: "0644"
        force: false
        timeout: 30
      register: roscomvpn_sha256_dl
      until: roscomvpn_sha256_dl is succeeded
      retries: 5
      delay: 6

    - name: Read expected sha256 from sidecar
      command: awk '{print $1}' "{{ xray_assets_dir }}/geoip.dat.sha256"
      register: roscomvpn_expected_sha256
      changed_when: false

    - name: Stat current geoip.dat
      stat:
        path: "{{ xray_assets_dir }}/geoip.dat"
        checksum_algorithm: sha256
      register: roscomvpn_current_stat

    # GitHub release CDN occasionally returns 502/503 (especially under CI load).
    # Retry up to 5 times with 6s delay so transient gateway errors don't abort
    # the play — the same retry pattern is applied to the sidecar download above.
    - name: Download roscomvpn geoip.dat (only when sha256 differs)
      get_url:
        url: "{{ roscomvpn_geoip_url }}"
        dest: "{{ xray_assets_dir }}/geoip.dat.new"
        mode: "0644"
        force: true
        timeout: 60
      when: >-
        not roscomvpn_current_stat.stat.exists or
        roscomvpn_current_stat.stat.checksum != roscomvpn_expected_sha256.stdout
      register: roscomvpn_download
      until: roscomvpn_download is succeeded
      retries: 5
      delay: 6

    - name: Verify roscomvpn geoip.dat checksum
      shell: |
        set -euo pipefail
        actual=$(sha256sum "{{ xray_assets_dir }}/geoip.dat.new" | awk '{print $1}')
        [ "{{ roscomvpn_expected_sha256.stdout }}" = "$actual" ]
      args:
        executable: /bin/bash
      changed_when: false
      when: roscomvpn_download is changed

    - name: Activate roscomvpn geoip.dat
      command: mv "{{ xray_assets_dir }}/geoip.dat.new" "{{ xray_assets_dir }}/geoip.dat"
      notify: restart xray
      when: roscomvpn_download is changed

- name: Drop weekly geodata updater script
  copy:
    dest: /usr/local/bin/xray-update-geodata.sh
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      # Auto-installed by chain-proxy ansible role. Refreshes geoip/geosite
      # and reloads Xray. Runs from cron — see /etc/cron.d/xray-geodata.
      set -euo pipefail
      curl -fsSL https://github.com/XTLS/Xray-install/raw/main/install-release.sh \
        | bash -s -- install-geodata
      {% if roscomvpn_geoip_enabled %}
      tmp=$(mktemp -d)
      trap 'rm -rf "$tmp"' EXIT
      curl -fsSL "{{ roscomvpn_geoip_url }}" -o "$tmp/geoip.dat"
      curl -fsSL "{{ roscomvpn_geoip_sha256_url }}" -o "$tmp/geoip.dat.sha256"
      expected=$(awk '{print $1}' "$tmp/geoip.dat.sha256")
      actual=$(sha256sum "$tmp/geoip.dat" | awk '{print $1}')
      if [ "$expected" != "$actual" ]; then
        echo "roscomvpn geoip.dat sha256 mismatch (expected $expected, got $actual)" >&2
        exit 1
      fi
      install -m 0644 "$tmp/geoip.dat" {{ xray_assets_dir }}/geoip.dat
      {% endif %}
      systemctl reload-or-restart {{ xray_service_name }}

- name: Ensure cron package is installed (required by ansible.builtin.cron)
  apt:
    name: cron
    state: present
    update_cache: false
  when: geodata_update_enabled

- name: Ensure cron service is running
  service:
    name: cron
    state: started
    enabled: true
  when: geodata_update_enabled

- name: Schedule weekly geodata update
  cron:
    name: "xray geodata weekly refresh"
    minute: "{{ geodata_update_cron.minute }}"
    hour: "{{ geodata_update_cron.hour }}"
    weekday: "{{ geodata_update_cron.weekday }}"
    job: "/usr/local/bin/xray-update-geodata.sh >>/var/log/xray-geodata.log 2>&1"
    user: root
  when: geodata_update_enabled

- name: Ensure Xray is enabled at boot
  systemd:
    name: "{{ xray_service_name }}"
    enabled: true
