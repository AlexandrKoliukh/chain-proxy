---
- name: Wait for apt/dpkg locks to release
  shell: |
    while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 2; done
  changed_when: false

- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install baseline packages
  apt:
    name:
      - curl
      - ca-certificates
      - jq
      - unzip
      - ufw
      - chrony
      - openssl
      - gnupg
      - python3
    state: present

- name: Ensure chrony is running (Reality needs accurate clock)
  systemd:
    name: chrony
    state: started
    enabled: true

- name: Configure UFW defaults
  when: firewall_enabled
  block:
    - name: Allow inbound TCP ports
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ firewall_allowed_tcp_ports }}"

    - name: Allow inbound UDP ports
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: udp
      loop: "{{ firewall_allowed_udp_ports | default([]) }}"

    - name: Set default incoming policy to deny
      ufw:
        default: deny
        direction: incoming

    - name: Set default outgoing policy to allow
      ufw:
        default: allow
        direction: outgoing

    - name: Enable UFW
      ufw:
        state: enabled

- name: Tune kernel network stack (BBR + buffers + MTU probing for proxy traffic)
  copy:
    dest: /etc/sysctl.d/99-chain-proxy.conf
    mode: "0644"
    content: |
      # Congestion control + qdisc
      net.core.default_qdisc = fq
      net.ipv4.tcp_congestion_control = bbr
      net.ipv4.tcp_fastopen = 3
      net.ipv4.ip_forward = 1
      net.ipv4.conf.all.src_valid_mark = 1

      # Larger socket buffers — needed for high-BDP foreign link
      net.core.rmem_max = 16777216
      net.core.wmem_max = 16777216
      net.ipv4.tcp_rmem = 4096 87380 16777216
      net.ipv4.tcp_wmem = 4096 65536 16777216
      net.core.netdev_max_backlog = 16384

      # Better behaviour over WireGuard / lossy paths
      net.ipv4.tcp_mtu_probing = 1
      net.ipv4.tcp_slow_start_after_idle = 0
      net.ipv4.tcp_notsent_lowat = 16384

      # UDP buffer floor (matters for WireGuard data plane)
      net.ipv4.udp_rmem_min = 8192
      net.ipv4.udp_wmem_min = 8192
  notify: apply sysctl
