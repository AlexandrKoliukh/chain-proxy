---
- name: Validate that all required entry variables are filled in
  assert:
    that:
      - entry_private_key  | length > 0
      - entry_public_key   | length > 0
      - entry_short_id     | length > 0
      - entry_clients | length > 0
    fail_msg: >-
      Missing ENTRY_* env vars. Run `make gen-keys` (writes into .env)
      and make sure .env has IP_VPS1 and IP_VPS2.

- name: Deploy Xray entry config (VLESS+Reality in, freedom→wg0 chain out)
  template:
    src: config.json.j2
    dest: "{{ xray_config_dir }}/config.json"
    owner: root
    group: root
    mode: "0644"
  notify: restart xray

# validate= passes a temp file with no extension; Xray >=25 infers format
# from extension and refuses to parse it. Test against the deployed path instead.
- name: Validate deployed Xray config
  command: /usr/local/bin/xray -test -config {{ xray_config_dir }}/config.json
  changed_when: false
