---
- name: Verify wireguard role — handshake + entry routing + exit NAT
  hosts: all
  become: true
  vars_files:
    - ../../../../group_vars/all.yml
  tasks:
    - name: Wait for the WG handshake to settle
      pause:
        seconds: 8

    - name: wg-quick@wg0 active
      command: systemctl is-active wg-quick@wg0
      register: wg_active
      changed_when: false
      failed_when: "'active' not in wg_active.stdout"

    - name: wg show wg0 reports a peer
      command: wg show wg0 peers
      register: wg_peers
      changed_when: false
      failed_when: wg_peers.stdout | length == 0

    - name: Latest handshake recorded
      command: wg show wg0 latest-handshakes
      register: wg_handshakes
      changed_when: false

    - name: Handshake timestamp is non-zero (real bidirectional connectivity)
      assert:
        that:
          - "(wg_handshakes.stdout.split() | last | int) > 0"
        fail_msg: "WG handshake never happened: {{ wg_handshakes.stdout }}"

- name: Verify entry-side fwmark policy routing
  hosts: entry
  become: true
  vars_files:
    - ../../../../group_vars/all.yml
  tasks:
    - name: ip rule contains fwmark policy
      command: ip rule show
      register: ip_rules
      changed_when: false

    - name: fwmark rule installed
      assert:
        that:
          - "'fwmark 0xff lookup ' + (wg_route_table | string) in ip_rules.stdout or 'fwmark 0xff lookup 100' in ip_rules.stdout"

    - name: Default route installed in custom table
      command: ip route show table {{ wg_route_table }}
      register: table_routes
      changed_when: false
      failed_when: "'default dev wg0' not in table_routes.stdout"

- name: Verify exit-side FORWARD + MASQUERADE
  hosts: exit
  become: true
  vars_files:
    - ../../../../group_vars/all.yml
  tasks:
    - name: ip_forward enabled
      command: sysctl -n net.ipv4.ip_forward
      register: ip_forward
      changed_when: false
      failed_when: ip_forward.stdout.strip() != "1"

    - name: FORWARD chain has wg0 ACCEPT rules at top
      shell: iptables -nvL FORWARD --line-numbers | head -10
      register: forward_chain
      changed_when: false

    - name: Both wg0 ACCEPT rules present
      assert:
        that:
          - "'wg0' in forward_chain.stdout"
          - forward_chain.stdout.count('wg0') >= 2

    - name: NAT POSTROUTING masquerades the WG subnet
      shell: iptables -t nat -nvL POSTROUTING
      register: nat_chain
      changed_when: false
      failed_when: "'MASQUERADE' not in nat_chain.stdout or '10.66.0.0/30' not in nat_chain.stdout"
