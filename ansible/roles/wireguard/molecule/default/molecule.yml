---
# Two-container scenario: cp-wg-entry + cp-wg-exit on the same docker network.
# Verifies that the wireguard role brings up the inter-VPS tunnel, fwmark
# policy routing on entry, and NAT/FORWARD chain on exit. Requires the
# kernel wireguard module on the host (modprobe wireguard) — GH Actions
# ubuntu-latest has it built in.
dependency:
  name: galaxy
  enabled: false
driver:
  name: default
  options:
    managed: true
    login_cmd_template: "docker exec -ti {instance} bash"
    ansible_connection_options:
      ansible_connection: docker
platforms:
  - name: cp-wg-entry
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    groups:
      - entry
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /lib/modules:/lib/modules:ro
    capabilities:
      - NET_ADMIN
      - SYS_MODULE
    tmpfs:
      - /run
      - /tmp
    networks:
      - name: cp_wg_net
    docker_networks:
      - name: cp_wg_net
        driver: bridge

  - name: cp-wg-exit
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    groups:
      - exit
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /lib/modules:/lib/modules:ro
    capabilities:
      - NET_ADMIN
      - SYS_MODULE
    tmpfs:
      - /run
      - /tmp
    networks:
      - name: cp_wg_net
provisioner:
  name: ansible
  config_options:
    defaults:
      stdout_callback: yaml
  inventory:
    group_vars:
      all:
        # Static test keypairs (generated once with `wg genkey | wg pubkey`).
        # OK to be public — they only secure the throwaway molecule tunnel.
        wg_vps1_private: "+EBhtUH2Lz7y9D4lHBL9k8oGm7kx0Wk4uCnH6fbxWFQ="
        wg_vps1_public:  "n/3VbrL97yV5o3T8OVqOg6e4qvuYvXg4WvgGjrxYxVk="
        wg_vps2_private: "iJL9R6oRbV8SsM5bRQwNkyA6yvGLOIGoBGxs+13d918="
        wg_vps2_public:  "RoIuqLF4z5lykaZD8a5iVuw8X1LpD5K1KKHAvTQYAFE="
verifier:
  name: ansible
