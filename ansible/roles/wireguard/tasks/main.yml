---
# Inter-VPS tunnel: kernel-space WireGuard between VPS1 (entry) and VPS2 (exit).
# Replaces the previous nested VLESS+Reality hop. Reality stays only on the
# client-facing inbound (VPS1).
#
# Topology:
#   VPS1 wg0 = 10.66.0.1/30  ──UDP/51820──▶  VPS2 wg0 = 10.66.0.2/30
#
# On VPS1: PostUp installs `ip rule fwmark <wg_fwmark> lookup <wg_route_table>`
#          and `default dev wg0` in that table. Xray marks its chain-proxy
#          outbound sockets with the same fwmark via streamSettings.sockopt.mark.
# On VPS2: PostUp enables FORWARD + MASQUERADE so traffic from 10.66.0.0/30
#          egresses via the public interface.

- name: Validate WireGuard variables are populated
  assert:
    that:
      - wg_private_key      | length > 0
      - wg_peer_public_key  | length > 0
    fail_msg: >-
      Missing WG_VPS{1,2}_PRIVATE / WG_VPS{1,2}_PUBLIC env vars.
      Run `make gen-keys` to populate them in .env.

- name: Install WireGuard userspace tools
  apt:
    name:
      - wireguard
      - wireguard-tools
    state: present
    install_recommends: false

- name: Ensure /etc/wireguard exists with strict perms
  file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Render wg0.conf
  template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  notify: restart wg-quick@wg0

- name: Open WireGuard UDP port in UFW
  ufw:
    rule: allow
    port: "{{ wg_listen_port }}"
    proto: udp
  when: firewall_enabled | default(true)

- name: Enable and start wg-quick@wg0
  systemd:
    name: "wg-quick@wg0"
    enabled: true
    state: started
    daemon_reload: true
