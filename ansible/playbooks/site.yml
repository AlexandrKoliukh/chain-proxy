---
# ═══════════════════════════════════════════════════════════════════
# chain-proxy: VLESS+Reality (client → VPS1) + WireGuard (VPS1 → VPS2)
#   Client ──[Reality/TCP]──▶ VPS1 (Xray entry)
#                                │
#                                ├── geoip:ru / geosite:ru → freedom (RU exit via VPS1)
#                                ├── geoip:private          → block
#                                └── default → freedom + sockopt.mark
#                                                  │
#                                          ip rule fwmark → wg0
#                                                  │
#                                          WireGuard UDP/51820
#                                                  │
#                                                  ▼
#                                          VPS2 wg-easy (Docker) → MASQUERADE → Internet
#                                          also accepts direct WireGuard clients via GUI
# ═══════════════════════════════════════════════════════════════════

- name: Baseline — all nodes (firewall, sysctl)
  hosts: all
  become: true
  gather_facts: true
  roles:
    - common

- name: Configure VPS2 (exit, foreign) — wg-easy WireGuard GUI + NAT gateway
  hosts: exit
  become: true
  gather_facts: true
  roles:
    - wg_easy

- name: Configure VPS1 (entry, home) — kernel WireGuard + Xray VLESS+Reality
  hosts: entry
  become: true
  gather_facts: false
  roles:
    - wireguard
    - xray
    - xray_entry

- name: Print verification hints
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _entry: "{{ hostvars[groups['entry'][0]] }}"
    _vless_uris: >-
      {{ _entry.entry_clients | map('combine', {'_uri':
        'vless://__ID__@' ~ _entry.ansible_host ~ ':' ~ (_entry.entry_listen_port | default(443)) ~
        '?type=tcp&security=reality&pbk=' ~ (_entry.entry_public_key | default('<ENTRY_PUB>')) ~
        '&fp=' ~ (_entry.reality_fingerprint | default('chrome')) ~
        '&sni=' ~ (_entry.reality_dest_host | default('www.microsoft.com')) ~
        '&sid=' ~ (_entry.entry_short_id | default('<ENTRY_SID>')) ~
        '&flow=xtls-rprx-vision#chain-ru-__EMAIL__'}) | list }}
  tasks:
    - name: Deployment summary
      debug:
        msg:
          - "═══════════════════════════════════════════════════════════════"
          - "✓ Deployment complete."
          - ""
          - "CLIENT CONNECTIONS (paste into Amnezia / v2rayN / NekoBox):"
          - ""
          - "  [{{ item.email }}]  {{ item._uri | replace('__ID__', item.id) | replace('__EMAIL__', item.email) }}"
      loop: "{{ _vless_uris }}"
      loop_control:
        label: "{{ item.email }}"

    - name: Verification hints
      debug:
        msg:
          - ""
          - "HOW TO VERIFY (from a client connected through this chain):"
          - ""
          - "  # Non-RU traffic must egress via VPS2 (foreign):"
          - "  curl -s https://api.ipify.org          # → VPS2 (foreign) IP"
          - "  curl -s https://ifconfig.me            # → VPS2 (foreign) IP"
          - ""
          - "  # RU-routed (should exit VPS1, see Russian content):"
          - "  curl -sI https://yandex.ru | head -n 1"
          - "  curl -sI https://mail.ru   | head -n 1"
          - "  curl -sI https://vk.com    | head -n 1"
          - ""
          - "  # Non-RU (should tunnel through VPS2, no captcha on Google):"
          - "  curl -sI https://www.google.com     | head -n 1"
          - "  curl -sI https://www.cloudflare.com | head -n 1"
          - ""
          - "SERVICE HEALTH:"
          - ""
          - "  make status       # systemctl status xray (entry) + wg handshake"
          - "  make logs         # journalctl -u xray -n 50 (entry only)"
          - "  make wg-show      # wg show on entry — handshake must be < 3 min ago"
          - ""
          - "WG-EASY GUI (direct clients on VPS2):"
          - ""
          - "  http://{{ hostvars[groups['exit'][0]].ansible_host }}:51821"
          - "  Username: admin   Password: see UI /settings → WireGuard Admin GUI"
          - ""
          - "DEBUG TIPS:"
          - ""
          - "  • Reality (client↔VPS1) needs accurate clock — check chrony:"
          - "      ansible -i ansible/inventory.yml all -b -a 'chronyc tracking'"
          - "  • If WG handshake never completes — check UDP/{{ hostvars[groups['entry'][0]].wg_listen_port | default(51820) }} is open both ways."
          - "  • If non-RU traffic egresses via VPS1 (wrong IP), the fwmark rule didn't install:"
          - "      ssh root@\\$IP_VPS1 'ip rule | grep fwmark'"
          - "      ssh root@\\$IP_VPS1 'ip route show table 100'"
          - "  • If VPS2 wg-easy container is not running:"
          - "      ssh root@\\$IP_VPS2 'docker ps --filter name=wg-easy'"
          - "      ssh root@\\$IP_VPS2 'docker logs wg-easy --tail 50'"
          - "  • FORWARD/MASQUERADE rules now managed by wg-easy container (not PostUp):"
          - "      ssh root@\\$IP_VPS2 'docker exec wg-easy iptables -nvL FORWARD'"
          - "  • If RU routing is broken, verify geodata is present on VPS1:"
          - "      ansible -i ansible/inventory.yml entry -b -a 'ls -la /usr/local/share/xray/'"
          - "═══════════════════════════════════════════════════════════════"
