name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  explain:
    if: |
      github.event.comment.user.login == github.repository.owner.login &&
      (contains(github.event.comment.body, ' /oc explain') ||
       startsWith(github.event.comment.body, '/oc explain') ||
       contains(github.event.comment.body, ' /opencode explain') ||
       startsWith(github.event.comment.body, '/opencode explain'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode explain
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/claude-sonnet-4-6
          language: ru
          prompt: |
            Твоя задача — объяснить issue. Отвечай на русском языке.
            Не создавай pull request. Не вноси никаких изменений в код.
            Просто напиши комментарий с объяснением.

  plan:
    if: |
      github.event.comment.user.login == github.repository.owner.login &&
      (contains(github.event.comment.body, ' /oc plan') ||
       startsWith(github.event.comment.body, '/oc plan') ||
       contains(github.event.comment.body, ' /opencode plan') ||
       startsWith(github.event.comment.body, '/opencode plan'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode plan
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/claude-sonnet-4-6
          language: ru
          prompt: |
            Твоя задача — составить план исправления issue. Отвечай на русском языке.
            Учитывай дополнительные указания пользователя из комментария.
            Не создавай pull request. Не вноси никаких изменений в код.
            Просто напиши комментарий с планом.

  fix:
    if: |
      github.event.comment.user.login == github.repository.owner.login &&
      (contains(github.event.comment.body, ' /oc fix') ||
       startsWith(github.event.comment.body, '/oc fix') ||
       contains(github.event.comment.body, ' /opencode fix') ||
       startsWith(github.event.comment.body, '/opencode fix'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run opencode fix
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/claude-sonnet-4-6
          language: ru
          prompt: |
            Твоя задача — исправить issue и создать pull request.
            Отвечай на русском языке.
            Прилинкуй PR к issue используя GitHub issue number.
            Создай ветку, закоммить изменения, запушь и создай PR с описанием исправления.

  opencode:
    if: |
      github.event.comment.user.login == github.repository.owner.login &&
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode')) &&
      !(contains(github.event.comment.body, ' /oc explain') ||
        startsWith(github.event.comment.body, '/oc explain') ||
        contains(github.event.comment.body, ' /opencode explain') ||
        startsWith(github.event.comment.body, '/opencode explain') ||
        contains(github.event.comment.body, ' /oc plan') ||
        startsWith(github.event.comment.body, '/oc plan') ||
        contains(github.event.comment.body, ' /opencode plan') ||
        startsWith(github.event.comment.body, '/opencode plan') ||
        contains(github.event.comment.body, ' /oc fix') ||
        startsWith(github.event.comment.body, '/oc fix') ||
        contains(github.event.comment.body, ' /opencode fix') ||
        startsWith(github.event.comment.body, '/opencode fix'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/claude-sonnet-4-6
          language: ru