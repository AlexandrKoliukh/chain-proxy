name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-api:
    name: unit + API (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install test deps
        run: pip install -r tests/requirements.txt
      - name: Run pytest
        working-directory: tests
        run: python -m pytest unit api -v --junitxml=junit.xml
      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: tests/junit.xml

  docker-image:
    name: Docker image smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t chain-proxy-ui:test .
      - name: Run container
        run: |
          docker run -d --rm \
            --name cpx-test \
            -p 18443:8443 \
            -e CHAIN_PROXY_DATA=/tmp/cpx \
            -e CHAIN_PROXY_CN=test \
            chain-proxy-ui:test
      - name: Wait for /healthz
        run: |
          for i in $(seq 1 60); do
            if curl --silent --insecure --max-time 2 https://127.0.0.1:18443/healthz | grep -q '"ok"'; then
              echo "healthz ok after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "healthz never responded"; docker logs cpx-test; exit 1
      - name: Container logs contain initial password
        run: |
          docker logs cpx-test 2>&1 | tee /tmp/cpx.log
          grep -q "initial admin password:" /tmp/cpx.log
      - name: Stop container
        if: always()
        run: docker stop cpx-test || true

  molecule:
    name: molecule (${{ matrix.role }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [common, xray, xray_entry]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ansible + molecule
        run: |
          pip install \
            "ansible-core==2.16.*" \
            "molecule==24.*" \
            "molecule-plugins[docker]==23.*" \
            "docker==7.*"
          ansible-galaxy collection install community.general ansible.posix community.docker
      - name: Run molecule
        working-directory: ansible/roles/${{ matrix.role }}
        run: molecule test
        env:
          ANSIBLE_FORCE_COLOR: "1"
          PY_COLORS: "1"
          MOLECULE_NO_LOG: "false"
